name: build for release

on:
  release:
    types: [published]

jobs:
  build-mod:
    name: Build Mod
    runs-on: ubuntu-latest
    env:
      MODKIT_VERSION: 0.13.0.4-beta-release-1024
      ECO_BRANCH: staging
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Fetch dependencies
      run: dotnet restore ./EcoCompaniesMod/EcoCompaniesMod.csproj
      env:
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
    - name: Build
      run: dotnet build ./EcoCompaniesMod/EcoCompaniesMod.csproj --configuration Release --no-restore /p:AssemblyVersion=${{github.event.release.tag_name}}
      env:
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-binaries-${{github.event.release.tag_name}}
        path: EcoCompaniesMod/bin/Release/net10.0/EcoCompaniesMod.*
  deploy:
    name: Upload Release Assets
    needs:
    - build-mod
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact (mod)
        id: download-mod
        uses: actions/download-artifact@v4
        with:
          name: mod-binaries-${{github.event.release.tag_name}}
      - name: Upload release asset (mod DLL)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{steps.download-mod.outputs.download-path}}/EcoCompaniesMod.dll
            ${{steps.download-mod.outputs.download-path}}/EcoCompaniesMod.pdb
